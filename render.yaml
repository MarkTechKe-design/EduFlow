services:
  - type: web
    name: eduflow-saas
    env: php
    region: frankfurt
    plan: free
    buildCommand: "composer install --no-dev --optimize-autoloader && npm install && npm run build && php artisan storage:link --force && touch database/database.sqlite && php artisan migrate --force && php artisan db:seed --force"
    startCommand: "chmod -R 777 storage bootstrap/cache && php -d upload_max_filesize=64M -d post_max_size=64M -d memory_limit=256M artisan serve --host=0.0.0.0 --port=$PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: array
      - key: CACHE_DRIVER
        value: array